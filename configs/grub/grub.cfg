# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Use graphics-mode output
insmod font
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
    if [ "${grub_cpu}" == 'x86_64' ]; then
        archiso_platform="x64 ${archiso_platform}"
    elif [ "${grub_cpu}" == 'i386' ]; then
        archiso_platform="IA32 ${archiso_platform}"
    else
        archiso_platform="${grub_cpu} ${archiso_platform}"
    fi
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu} ${grub_platform}"
fi

# Set default menu entry
default=archlinux
timeout=0
timeout_style=hidden

# The live kernel is the one the installer puts on the machine: linux-omarchy,
# and linux-t2 on a Mac, whose T2 models need it for the keyboard and trackpad.
# Only a firmware that names Apple Inc. as the system's maker boots linux-t2.
set live_kernel=%KERNEL%
if [ -f '/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2' ]; then
    unset sys_vendor
    if insmod smbios; then
        if smbios --type 1 --get-string 4 --set sys_vendor; then
            if [ "${sys_vendor}" == 'Apple Inc.' ]; then
                set live_kernel=linux-t2
            fi
        fi
    fi
fi

# Some N1x firmware hides \_SB.SSPM when _OSI("Windows 2022") is true, and
# without SSPM the I2C controllers behind the internal keyboard and touchpad
# never power on. The Lenovo Pro 9 15N1X11 (DMI product name 83SS) does, and
# so does the ASUS ProArt P16 (product name "ProArt P16 H7607BA", BIOS 300
# and 303), which is matched on its model number as the installed system's
# omarchy-hw-match H7607BA is. acpi_osi=! drops every built-in vendor string,
# including Windows 2022. The quoted form cannot be used here: GRUB's loader
# escapes the quotes and the space splits the parameter. The Dell XPS 16 and
# the ProArt P14 keep SSPM visible, so leave the parameter unset there. The
# installed system sets it through Limine instead.
set n1x_osi=
# Fork only: whether the ProArt P16 bring-up entries below are offered.
set p16_bringup=
if [ "${grub_cpu}" == 'arm64' ]; then
    unset product_name
    if insmod smbios; then
        if smbios --type 1 --get-string 5 --set product_name; then
            if [ "${product_name}" == '83SS' ]; then
                set n1x_osi='acpi_osi=!'
            elif regexp 'H7607BA' "${product_name}"; then
                set n1x_osi='acpi_osi=!'
                set p16_bringup=1
                # Fork only: the P16 shows the menu for 10 seconds, then
                # boots the recovery shell and its probe.
                set timeout=10
                set timeout_style=menu
                set default=n1x-recovery
            fi
        fi
    fi
fi


# Menu entries

# One image boots every board. A Snapdragon laptop's firmware provides no device
# tree, so where the build made a UKI that carries them, such a laptop boots
# that by default and every other machine boots the kernel directly. The
# processor's SMBIOS record tells them apart. The UKI starts Qualcomm firmware
# before searching USB media when its files are present. Keep automatic loading
# blocked for boards that need the legacy path: startup can reconfigure USB-C.
# Device memory access is translated: under a kernel's passthrough default the
# Yoga Slim 7x's keyboard and touchpad never appear.
if [ "${grub_cpu}" == 'arm64' -a -f '/%INSTALL_DIR%/boot/%ARCH%/omarchy-live.efi' ]; then
    insmod smbios
    smbios --type 4 --get-string 7 --set cpu_maker
    smbios --type 4 --get-string 16 --set cpu_name
    if regexp 'Qualcomm' "${cpu_maker}"; then
        default=archlinux-uki
    elif regexp 'Snapdragon' "${cpu_name}"; then
        default=archlinux-uki
    fi
    menuentry "Omarchy (%ARCH%, ${archiso_platform}, device tree)" --class arch --class gnu-linux --class gnu --class os --id 'archlinux-uki' {
        chainloader /%INSTALL_DIR%/boot/%ARCH%/omarchy-live.efi archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash initramfs_async=0 clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.tpm2_wait=0 iommu.passthrough=0 modprobe.blacklist=qcom_q6v5_pas omarchy.qcom_early=1
    }
fi

menuentry "Omarchy (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${live_kernel} archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %BOOT_SPLASH_KERNEL_OPTIONS%%KERNEL_OPTIONS% ${n1x_osi}
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${live_kernel}.img
}

menuentry "Omarchy with speakup screen reader (%ARCH%, ${archiso_platform})" --hotkey s --class arch --class gnu-linux --class gnu --class os --id 'archlinux-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${live_kernel} archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_OPTIONS% ${n1x_osi}
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${live_kernel}.img
}

%N1X_ONLY_BEGIN%
menuentry "N1x recovery shell (hardware probe, no installer)" --class arch --class gnu-linux --class gnu --class os --id 'n1x-recovery' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${live_kernel} archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=1G omarchy.n1x_recovery=1 acpi=nospcr disablehooks=plymouth plymouth.enable=0 nomodeset module_blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau nvidia_drm.modeset=0 systemd.unit=multi-user.target console=tty0 fbcon=map:0 earlycon loglevel=7 ignore_loglevel systemd.show_status=1 systemd.log_target=console udev.log_level=debug vt.global_cursor_default=1 ${n1x_osi}
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${live_kernel}.img
}

# Fork only, for bringing up the ASUS ProArt P16 H7607BA, and only where
# its gate above matched: the recovery shell with the firmware's own _OSI
# answers, which hide SSPM, for evidence of that state; the recovery shell
# without the MediaTek UART driver, in case the COM ports acpi_osi=!
# exposes stall its probe; and the installer without that driver.
if [ "${p16_bringup}" == 1 ]; then
    menuentry "N1x recovery shell, firmware _OSI (no acpi_osi)" --class arch --class gnu-linux --class gnu --class os --id 'p16-recovery-firmware-osi' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${live_kernel} archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=1G omarchy.n1x_recovery=1 acpi=nospcr disablehooks=plymouth plymouth.enable=0 nomodeset module_blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau nvidia_drm.modeset=0 systemd.unit=multi-user.target console=tty0 fbcon=map:0 earlycon loglevel=7 ignore_loglevel systemd.show_status=1 systemd.log_target=console udev.log_level=debug vt.global_cursor_default=1
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${live_kernel}.img
    }
    menuentry "N1x recovery shell without the MediaTek UART" --class arch --class gnu-linux --class gnu --class os --id 'p16-recovery-no-mtk-uart' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${live_kernel} archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=1G omarchy.n1x_recovery=1 acpi=nospcr disablehooks=plymouth plymouth.enable=0 nomodeset module_blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau nvidia_drm.modeset=0 systemd.unit=multi-user.target console=tty0 fbcon=map:0 earlycon loglevel=7 ignore_loglevel systemd.show_status=1 systemd.log_target=console udev.log_level=debug vt.global_cursor_default=1 initcall_blacklist=mtk8250_platform_driver_init ${n1x_osi}
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${live_kernel}.img
    }
    menuentry "Install Omarchy without the MediaTek UART" --class arch --class gnu-linux --class gnu --class os --id 'p16-install-no-mtk-uart' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${live_kernel} archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %BOOT_SPLASH_KERNEL_OPTIONS%%KERNEL_OPTIONS% initcall_blacklist=mtk8250_platform_driver_init ${n1x_osi}
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${live_kernel}.img
    }
fi
%N1X_ONLY_END%


if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    elif [ "${grub_cpu}" == "i386" -a -f '/shellia32.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellia32.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}


