# https://www.supergrubdisk.org/wiki/Loopback.cfg

# Search for the ISO volume
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
    if [ "${grub_cpu}" == 'x86_64' ]; then
        archiso_platform="x64 ${archiso_platform}"
    elif [ "${grub_cpu}" == 'i386' ]; then
        archiso_platform="IA32 ${archiso_platform}"
    else
        archiso_platform="${grub_cpu} ${archiso_platform}"
    fi
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu} ${grub_platform}"
fi

# Set default menu entry
default=archlinux
timeout=0
timeout_style=hidden

# The live kernel: linux-t2 only where the firmware names Apple Inc. as the
# system's maker, as in grub.cfg.
set live_kernel=%KERNEL%
if [ -f '/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2' ]; then
    unset sys_vendor
    if insmod smbios; then
        if smbios --type 1 --get-string 4 --set sys_vendor; then
            if [ "${sys_vendor}" == 'Apple Inc.' ]; then
                set live_kernel=linux-t2
            fi
        fi
    fi
fi

# Same N1x keyboard quirk as grub.cfg, for the Lenovo Pro 9 and the ASUS
# ProArt P16. acpi_osi=! because GRUB escapes quotes.
set n1x_osi=
# Fork only: whether the ProArt P16 bring-up entries below are offered.
set p16_bringup=
if [ "${grub_cpu}" == 'arm64' ]; then
    unset product_name
    if insmod smbios; then
        if smbios --type 1 --get-string 5 --set product_name; then
            if [ "${product_name}" == '83SS' ]; then
                set n1x_osi='acpi_osi=!'
            elif regexp 'H7607BA' "${product_name}"; then
                set n1x_osi='acpi_osi=!'
                set p16_bringup=1
                # Fork only: the P16's menu and default, as in grub.cfg.
                set timeout=10
                set timeout_style=menu
                set default=n1x-recovery
            fi
        fi
    fi
fi


# Menu entries

menuentry "Omarchy (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${live_kernel} archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %BOOT_SPLASH_KERNEL_OPTIONS%%KERNEL_OPTIONS% ${n1x_osi}
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${live_kernel}.img
}

menuentry "Omarchy with speakup screen reader (%ARCH%, ${archiso_platform})" --hotkey s --class arch --class gnu-linux --class gnu --class os --id 'archlinux-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${live_kernel} archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" accessibility=on %KERNEL_OPTIONS% ${n1x_osi}
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${live_kernel}.img
}

%N1X_ONLY_BEGIN%
menuentry "N1x recovery shell (hardware probe, no installer)" --hotkey r --class arch --class gnu-linux --class gnu --class os --id 'n1x-recovery' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${live_kernel} archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" cow_spacesize=1G omarchy.n1x_recovery=1 acpi=nospcr disablehooks=plymouth plymouth.enable=0 nomodeset module_blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau nvidia_drm.modeset=0 systemd.unit=multi-user.target console=tty0 fbcon=map:0 earlycon loglevel=7 ignore_loglevel systemd.show_status=1 systemd.log_target=console udev.log_level=debug vt.global_cursor_default=1 ${n1x_osi}
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${live_kernel}.img
}

# Fork only: the ProArt P16's bring-up entries, as in grub.cfg.
if [ "${p16_bringup}" == 1 ]; then
    menuentry "N1x recovery shell, firmware _OSI (no acpi_osi)" --class arch --class gnu-linux --class gnu --class os --id 'p16-recovery-firmware-osi' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${live_kernel} archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" cow_spacesize=1G omarchy.n1x_recovery=1 acpi=nospcr disablehooks=plymouth plymouth.enable=0 nomodeset module_blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau nvidia_drm.modeset=0 systemd.unit=multi-user.target console=tty0 fbcon=map:0 earlycon loglevel=7 ignore_loglevel systemd.show_status=1 systemd.log_target=console udev.log_level=debug vt.global_cursor_default=1
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${live_kernel}.img
    }
    menuentry "N1x recovery shell without the MediaTek UART" --class arch --class gnu-linux --class gnu --class os --id 'p16-recovery-no-mtk-uart' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${live_kernel} archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" cow_spacesize=1G omarchy.n1x_recovery=1 acpi=nospcr disablehooks=plymouth plymouth.enable=0 nomodeset module_blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau nvidia_drm.modeset=0 systemd.unit=multi-user.target console=tty0 fbcon=map:0 earlycon loglevel=7 ignore_loglevel systemd.show_status=1 systemd.log_target=console udev.log_level=debug vt.global_cursor_default=1 initcall_blacklist=mtk8250_platform_driver_init ${n1x_osi}
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${live_kernel}.img
    }
    menuentry "Install Omarchy without the MediaTek UART" --class arch --class gnu-linux --class gnu --class os --id 'p16-install-no-mtk-uart' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${live_kernel} archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %BOOT_SPLASH_KERNEL_OPTIONS%%KERNEL_OPTIONS% initcall_blacklist=mtk8250_platform_driver_init ${n1x_osi}
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${live_kernel}.img
    }
fi
%N1X_ONLY_END%


if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    elif [ "${grub_cpu}" == "i386" -a -f '/shellia32.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellia32.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}
